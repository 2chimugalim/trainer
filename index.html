<style>
/* Layout: topic bar on top; one topic at a time — formulas · mistakes · trainer card. Brand: Compass College (Black / Ivory / Pistachio). */
:root{
  --bg:#F4F3EE; --surface:#FFFFFF; --ivory:#E5E4DF; --ink:#141412; --muted:#5E5D57; --line:#D6D4CC;
  --accent:#ACB948; --accent-ink:#4E5718; --good:#2F7D3B; --good-bg:#E4F1E2; --bad:#B23A2A; --bad-bg:#F8E3DF;
  --font:'Roboto Condensed','Arial Narrow',Arial,sans-serif; --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  --base:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141412; --surface:#1E1E1B; --ivory:#2A2A26; --ink:#EEEDE7; --muted:#A7A59C; --line:#3A3934;
  --accent:#ACB948; --accent-ink:#D3DD86; --good:#7FC98A; --good-bg:#1F3323; --bad:#F0907F; --bad-bg:#3A201B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412; --surface:#1E1E1B; --ivory:#2A2A26; --ink:#EEEDE7; --muted:#A7A59C; --line:#3A3934;
  --accent:#ACB948; --accent-ink:#D3DD86; --good:#7FC98A; --good-bg:#1F3323; --bad:#F0907F; --bad-bg:#3A201B; color-scheme:dark}
:root.big{--base:22px}
/* «Крупно» для проектора: шире колонка и крупнее график */
:root.big .wrap{max-width:1180px}
:root.big svg.plot{max-width:640px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--base);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
header.top{background:var(--bg);padding-block:14px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.45em;margin:0;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.brand span{color:var(--muted);font-size:.85em}
.tools{display:flex;gap:14px;align-items:center}
.logo{height:36px;width:auto;display:block}
:root[data-theme="dark"] .logo{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
/* тёмная тема: светлая обводка в 1 пиксель вокруг пиксельного персонажа, иначе чёрный контур сливается с фоном */
:root[data-theme="dark"] svg.px{filter:drop-shadow(1.5px 0 0 var(--ink)) drop-shadow(-1.5px 0 0 var(--ink)) drop-shadow(0 1.5px 0 var(--ink)) drop-shadow(0 -1.5px 0 var(--ink))}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) svg.px{filter:drop-shadow(1.5px 0 0 var(--ink)) drop-shadow(-1.5px 0 0 var(--ink)) drop-shadow(0 1.5px 0 var(--ink)) drop-shadow(0 -1.5px 0 var(--ink))}}
@media (max-width:640px){.logo{height:28px}}
.tbtn{font:inherit;font-size:.82em;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* панель тем прилипает к верху экрана: тему можно сменить, не прокручивая наверх */
nav.topics{position:sticky;top:0;z-index:15;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding-block:10px;border-bottom:1px solid var(--line)}
@media (max-width:700px){nav.topics{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px 48px;
  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 48px),transparent)}
  nav.topics::-webkit-scrollbar{display:none}}
nav.topics a{flex:none;font-size:.86em;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;
  border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
nav.topics a:hover{border-color:var(--ink)}
nav.topics a .wk{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
nav.topics a.on{background:var(--accent);border-color:var(--accent);color:#141412}
nav.topics a.on .wk{color:#3B421A}
main{padding-top:20px;display:grid;gap:18px}
.eyebrow{text-transform:uppercase;letter-spacing:1.2px;font-size:.72em;color:var(--accent-ink);font-weight:700}
h2.tt{margin:2px 0 0;font-size:1.7em;line-height:1.15;text-wrap:balance}
.lead{color:var(--muted);margin:6px 0 0;max-width:75ch}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h3{margin:0 0 10px;font-size:.78em;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted)}
.mat{display:grid;gap:8px}
.matrow{display:grid;gap:5px}
.matrow .les{font-size:.8em;font-weight:700;color:var(--muted);min-width:64px;font-variant-numeric:tabular-nums}
.matrow .links{display:flex;gap:6px;flex-wrap:wrap}
a.mlink{display:inline-flex;gap:6px;align-items:baseline;font-size:.88em;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 10px}
a.mlink:hover{border-color:var(--ink)}
a.mlink .k{color:var(--muted);font-size:.85em}
a.mlink::after{content:"↗";color:var(--muted);font-size:.85em}
.f{font-size:1em;font-weight:500;font-variant-numeric:tabular-nums;padding:7px 10px;background:var(--ivory);border-radius:6px;margin:0 0 6px;overflow-wrap:anywhere}
.fnote{font-size:.86em;color:var(--muted);margin:2px 0 10px}
ul.err{margin:0;padding-left:18px;display:grid;gap:8px}
ul.err li b{font-weight:700}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;display:grid;gap:14px}
.cardhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.cardhead .score{margin-left:auto}
.cardhead .eyebrow{color:var(--muted)}
.score{font-size:.85em;color:var(--muted);font-variant-numeric:tabular-nums}
select#kind{font:inherit;font-size:.86em;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:100%}
.q{font-size:1.12em;line-height:1.5;margin:0}
.q .num{font-variant-numeric:tabular-nums;white-space:nowrap}
table.tbl{border-collapse:collapse;font-variant-numeric:tabular-nums}
table.tbl td,table.tbl th{border:1px solid var(--line);padding:6px 12px;text-align:center}
table.tbl th{background:var(--ivory);font-weight:500}
.tblwrap{overflow-x:auto}
svg.plot{width:100%;max-width:420px;height:auto;display:block}
.fields{display:grid;gap:14px}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field label{min-width:110px;flex:0 1 auto}
@media (max-width:520px){.field{gap:8px}.field label{min-width:0;flex:1 0 100%}.field input{width:auto;flex:1 1 0;min-width:0}}
.pm{display:none;font:inherit;font-weight:700;font-size:1.05em;min-width:44px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
@media (pointer:coarse){.pm{display:inline-block}}
.field input{font:inherit;font-family:var(--mono);font-size:max(1em,16px);width:150px;max-width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.field input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.field .unit{color:var(--muted);font-size:.9em}
.field.ok input{border-color:var(--good);background:var(--good-bg)}
.field.no input{border-color:var(--bad);background:var(--bad-bg)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.92em;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:var(--mono)}
.seg button.sel{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.field.ok .seg button.sel{background:var(--good);border-color:var(--good);color:#fff}
.field.no .seg button.sel{background:var(--bad);border-color:var(--bad);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#task .msg{margin-top:12px}
#task .tip,#task .hints,#task #sol{margin-top:10px}
a.btn{display:inline-block;text-decoration:none}
.btn{font:inherit;font-weight:700;border-radius:9px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.msg{font-weight:700;margin:0;min-height:1.3em}
.msg.ok{color:var(--good)} .msg.no{color:var(--bad)}
.tip{border-left:4px solid var(--bad);background:var(--bad-bg);padding:8px 12px;border-radius:0 8px 8px 0;font-weight:500}
.tip p{margin:2px 0}
.hints{display:grid;gap:8px}
.hint{border-left:4px solid var(--accent);background:var(--ivory);padding:8px 12px;border-radius:0 8px 8px 0}
.hint b{color:var(--accent-ink)}
.sol{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;background:var(--bg)}
.sol p{margin:4px 0;font-variant-numeric:tabular-nums;white-space:pre-wrap}
.src{display:block;font-size:.78em;color:var(--muted);margin-bottom:4px;letter-spacing:.3px}
/* landing */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:22px 24px 0;overflow:hidden}
.hero h2{font-size:2em;line-height:1.1;margin:4px 0 8px;text-wrap:balance}
.hero p{margin:0 0 10px;max-width:60ch}
.hero .cta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
.hero .me{position:relative;width:300px;align-self:end}
.hero .me svg{width:300px;height:auto;display:block}
@media (max-width:640px){.hero{grid-template-columns:1fr}.hero .me{justify-self:center;width:100%;max-width:300px}.hero .me svg{width:100%}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.7em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.86em}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{font:inherit;text-align:left;text-decoration:none;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:3px}
.tcard:hover{border-color:var(--ink)}
.tcard .wk{font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.tcard b{font-size:1.02em}
.tcard span.n{font-size:.82em;color:var(--muted)}
.tcard.mid{border:2px solid var(--accent)}
h3.sec{margin:6px 0 0;font-size:.8em;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
a.lnk{color:var(--ink)}
/* buddy */
#buddy{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:0;z-index:20;width:110px;pointer-events:none;transform:translateY(110%);visibility:hidden;transition:transform .35s cubic-bezier(.3,1.4,.5,1),visibility 0s .35s}
#buddy.on{transform:translateY(0);visibility:visible;transition:transform .35s cubic-bezier(.3,1.4,.5,1),visibility 0s}
#buddy svg{width:110px;height:auto;display:block}
#buddy .say{position:absolute;right:92%;top:0;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:7px 14px;font-size:1.35em;font-weight:700;box-shadow:0 3px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){#buddy{transition:none}}
@media (max-width:640px){#buddy{width:84px}#buddy svg{width:84px}#buddy .say{font-size:1.15em}}
footer{color:var(--muted);font-size:.82em;padding-top:8px}
@media (prefers-reduced-motion:no-preference){.hint,.sol{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(3px)}to{opacity:1}}}
</style>

<main id="main"><noscript><p class="lead">Для работы тренажёра нужен JavaScript. Включите его в настройках браузера или откройте сайт в другом браузере.</p></noscript></main>
<div id="buddy" aria-hidden="true"><div class="say" id="buddysay"></div></div>
<footer>Ответы с запятой или точкой — как удобно. Дробь можно писать как 1/64. Числа в задачах меняются при каждой новой задаче. В мидтерме примерно каждая третья задача — настоящая из вариантов α и β, остальные — по мотивам.</footer>

<script>
/* ---------- helpers ---------- */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const r2=(x,d)=>{const p=10**d;return Math.round(x*p+1e-9*Math.sign(x))/p};
const F=(x,d=2)=>{if(typeof x!=='number')return x;const s=Number(r2(x,d)).toLocaleString('ru-RU',{maximumFractionDigits:d,useGrouping:true});return s.replace(/ /g,' ').replace(/^-/,'−')};
const N=x=>`<span class="num">${x}</span>`;
const sup=s=>`<sup>${s}</sup>`;
const sig2=x=>{if(x===0)return 0;const e=Math.floor(Math.log10(Math.abs(x)));const p=10**(e-1);return Math.round(x/p)*p};
const ceil1=x=>{const p=10**Math.floor(Math.log10(x)+1e-12);return Math.ceil(x/p-1e-9)*p};
const PHI=(1+Math.sqrt(5))/2;
const pl=(n,f)=>{const a=n%10,b=n%100;return n+' '+(a===1&&b!==11?f[0]:a>=2&&a<=4&&(b<12||b>14)?f[1]:f[2])};
const YRS=['год','года','лет'],MON=['месяц','месяца','месяцев'];
const MN=x=>String(x).replace('-','−');
const RAZ=k=>{k=r2(k,6);return Number.isInteger(k)?pl(k,['раз','раза','раз']).split(' ')[1]:'раза'};
function parseAns(s){
  if(s==null)return NaN;s=String(s).trim().replace(/[\s  ]/g,'').replace(/%$/,'').replace(/,/g,'.').replace(/−/g,'-');
  if(!s)return NaN;
  const m=s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);
  return /^-?\d*\.?\d+(e-?\d+)?$/i.test(s)?parseFloat(s):NaN;
}
const num=(label,ans,o={})=>({kind:'num',label,ans,tol:o.tol??1e-6,unit:o.unit||'',flex:!!o.flex,show:o.show??F(ans,o.flex?2:4),traps:o.traps||[],exact:o.exact,up:!!o.up});
const decOf=s=>{s=String(s).replace(/,/g,'.');if(s.includes('/'))return 6;const m=s.match(/\.(\d+)/);return m?m[1].length:0};
const choice=(label,opts,ans)=>({kind:'choice',label,opts,ans,show:ans});
function expandNum(d2,n){ // d2 = two digits as integer 10..99, value d2*10^(n-1)
  const digits=String(d2).replace(/0$/,'')||'0';const lead=String(d2);const e=n-1;
  if(e>=0){return F(d2*10**e,0)}
  const k=-e; let s=lead.padStart(k+1,'0'); s=s.slice(0,s.length-k)+','+s.slice(s.length-k); return s.replace(/0+$/,'').replace(/,$/,'');
}
const pw=n=>'<sup>'+String(n).replace('-','−')+'</sup>';

/* ---------- midterm data ---------- */
const src=(s,c)=>`<span class="src">${s?'Мидтерм · вариант '+s+(c?' · '+c:''):'По мотивам мидтерма'+(c?' · задача '+c:'')}</span>`;
const fx=x=>F(x,2).includes(',')?F(x,2).padEnd(F(x,2).indexOf(',')+3,'0'):F(x,0)+',00';

function buddySVG(which='smile'){const S=which==='hello'?pick(SPRS.hello):SPRS.smile;const w=Math.max(...S.map(r=>r.length)),h=S.length;let r='';
  S.forEach((row,y)=>[...row].forEach((ch,x)=>{if(PAL[ch])r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[ch]}"/>`}));

/* ---------- plot ---------- */
function plot(fn,pts,xr,yr){
  const W=360,H=240,P=30;const sx=x=>P+(x-xr[0])/(xr[1]-xr[0])*(W-2*P);const sy=y=>H-P-(y-yr[0])/(yr[1]-yr[0])*(H-2*P);
  let g='';for(let x=Math.ceil(xr[0]);x<=xr[1];x++){g+=`<line x1="${sx(x)}" y1="${sy(yr[0])}" x2="${sx(x)}" y2="${sy(yr[1])}" class="gr"/>`;if(x!==0)g+=`<text x="${sx(x)}" y="${sy(0)+16}" text-anchor="middle" class="lb">${x}</text>`}
  const st=niceStep(yr[1]-yr[0]);for(let y=Math.ceil(yr[0]/st)*st;y<=yr[1]+1e-9;y+=st){g+=`<line x1="${sx(xr[0])}" y1="${sy(y)}" x2="${sx(xr[1])}" y2="${sy(y)}" class="gr"/>`;if(Math.abs(y)>1e-9)g+=`<text x="${sx(0)-6}" y="${sy(y)+4}" text-anchor="end" class="lb">${F(y,2)}</text>`}
  let d='';let on=false;for(let i=0;i<=300;i++){const x=xr[0]+(xr[1]-xr[0])*i/300;const y=fn(x);if(!isFinite(y)||y<yr[0]-1||y>yr[1]+1){on=false;continue}d+=(on?'L':'M')+sx(x).toFixed(1)+','+sy(Math.max(yr[0],Math.min(yr[1],y))).toFixed(1);on=true}
  const dots=pts.map(([x,y])=>`<circle cx="${sx(x)}" cy="${sy(y)}" r="4.5" class="dt"/><text x="${sx(x)+7}" y="${sy(y)-7}" class="pl">(${F(x)}; ${F(y)})</text>`).join('');
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="График функции"><style>.gr{stroke:var(--line);stroke-width:1}.ax{stroke:var(--muted);stroke-width:1.5}.lb{fill:var(--muted);font:11px var(--font)}.pl{fill:var(--ink);font:12px var(--font)}.cv{fill:none;stroke:var(--ink);stroke-width:2.2}.dt{fill:var(--accent);stroke:var(--ink);stroke-width:1.5}</style>${g}<line x1="${sx(xr[0])}" y1="${sy(0)}" x2="${sx(xr[1])}" y2="${sy(0)}" class="ax"/><line x1="${sx(0)}" y1="${sy(yr[0])}" x2="${sx(0)}" y2="${sy(yr[1])}" class="ax"/><path d="${d}" class="cv"/>${dots}</svg>`;
}
function niceStep(r){const s=r/6;const p=10**Math.floor(Math.log10(s));const m=s/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}

  'Во сколько раз больше лист':()=>{const m=ri(0,5),k=m+ri(2,4);return{q:`Во сколько раз площадь листа A${m} больше площади листа A${k}?`,fields:[num('в',2**(k-m),{unit:RAZ(2**(k-m))})],

  'Сумма площадей листов':()=>{const set=pick([[2,4,6],[1,3,5],[3,4,5],[2,3,4],[0,2,4],[4,6,8],[1,2,3,4]]);const mx=Math.max(...set);const numr=set.reduce((s,n)=>s+2**(mx-n),0);

{id:'err',wk:'н3',title:'Приближённые вычисления и погрешность',lead:'Любой замер неточен. Записываем a ± Δ и считаем, сколько материала купить с запасом.',

  'Площадь с погрешностью':()=>{let a,b,S,rule,dev;do{a=ri(12,32)/10;b=ri(8,22)/10;S=a*b;rule=S*(0.01/a+0.01/b);dev=Math.max(S-(a-.01)*(b-.01),(a+.01)*(b+.01)-S)}while(Math.abs(ceil1(rule)-ceil1(dev))>1e-9);

     fields:[num('S =',r2(S,4),{tol:0.006,unit:'м²'}),num('Δ =',ceil1(rule),{tol:1e-9,unit:'м²',exact:rule,up:true})],
     hints:[`S = ${F(a,2)} × ${F(b,2)}. δS = 0,01 : ${F(a,2)} + 0,01 : ${F(b,2)}.`,'ΔS = S × δS — и округли вверх до одной значащей цифры. Проверка: перемножь границы сторон.'],
     sol:[`S = ${F(S,4)} м²`,`δS = ${F(0.01/a*100,2)} % + ${F(0.01/b*100,2)} % ≈ ${F((0.01/a+0.01/b)*100,2)} %`,`ΔS = ${F(S,4)} × ${F(0.01/a+0.01/b,4)} ≈ ${F(rule,4)} → вверх ${F(ceil1(rule),2)}`,`Проверка: ${F((a-.01)*(b-.01),4)} … ${F((a+.01)*(b+.01),4)}`]}},

     fields:[num('стоимость',r2(c,0),{tol:1.01,unit:'сом',traps:[[S*pr,'Закупаем по наибольшей площади: S + ΔS, а не по S.'],[(S-D)*pr,'Закупаем по наибольшей площади: S + ΔS, а не по наименьшей.']]})],hints:['Наибольшая площадь — S + Δ.','Умножь её на цену за м².'],sol:[`${F(S,2)} + ${F(D,2)} = ${F(S+D,2)} м²`,`${F(S+D,2)} × ${pr} = ${F(c,2)} сом`]}},

     hints:['P = 2 × (a + b).','У периметра четыре стороны — погрешности всех четырёх складываются.'],sol:[`P = 2 × (${F(a,1)} + ${F(b,1)}) = ${F(2*(a+b),1)} см`,`ΔP = 2 × (${F(D,1)} + ${F(D,1)}) = ${F(4*D,1)} см`]}}
 }},
{id:'pow',wk:'н4',title:'Степени и корни',lead:'Дробный показатель — это корень и степень сразу. Отрицательный — «один делить на».',

  'Дробный показатель':()=>{const q=pick([2,3,4,5]);const r={2:ri(2,9),3:ri(2,5),4:pick([2,3]),5:2}[q];const base=r**q;let p=pick([1,2,3].filter(x=>x!==q&&r**x<=1000));
    return{q:`Вычислите: ${N(F(base,0)+sup(p+'/'+q))}`,fields:[num('Ответ',r**p)],hints:[`Сначала корень ${q}-й степени из ${F(base,0)}.`,`Потом результат — в степень ${p}.`],sol:[`${q===2?'√':q===3?'∛':'⁽'+q+'⁾√'}${F(base,0)} = ${r}`,`${r}${pw(p)} = ${r**p}`]}},

  'Сумма как на мидтерме':()=>{const q=pick([2,3,4]);const r={2:ri(2,9),3:ri(2,5),4:pick([2,3])}[q];const p=q===2?pick([1,3]):pick([1,2]);const t=pick([2,3,4]);const m=ri(1,3);const s=t*m;

{id:'func',wk:'н6–7',title:'Функция по графику и таблице',lead:'Узнаём зависимость по точкам, находим наибольшее и наименьшее значение на отрезке.',
 formulas:[['y = kx   → x × 2, y × 2','прямая через начало'],['y = k/x   → x × 2, y : 2','xy = k — гипербола'],['y = ax²   → x × 2, y × 4','парабола'],['y = ax³   → x × 2, y × 8',''],['коэффициент: подставь точку, например x = 1',''],['наибольшее и наименьшее на отрезке — на концах или в вершине (для ax² — в x = 0)','']],

    const pts=xs.map(x=>[x,f(x)]);const ymax=Math.max(...pts.map(p=>p[1]))*1.15;

     fields:[choice('тип',['y = kx','y = k/x','y = ax²','y = ax³'],t==='kx'?'y = kx':t==='k/x'?'y = k/x':t==='ax²'?'y = ax²':'y = ax³'),num(t.startsWith('k')?'k =':'a =',c)],
     hints:['Возьми две точки, где x вырос вдвое (или втрое). Во сколько раз изменился y?','Коэффициент: подставь одну точку в формулу.'],
     sol:[`x: ${F(pts[0][0])} → ${F(pts[1][0])}, y: ${F(pts[0][1])} → ${F(pts[1][1])}`,`это ${t==='kx'?'y = kx':t==='k/x'?'y = k/x':t==='ax²'?'y = ax²':'y = ax³'}, коэффициент ${F(c)}`]}},
  'Наибольшее и наименьшее на отрезке':()=>{const t=pick(['k/x','ax²','ax³']);let f,c,p,q,label;
    if(t==='k/x'){c=pick([6,8,12,24]);f=x=>c/x;p=pick([1,2]);q=pick([4,6].filter(v=>v>p));label=`y = ${c}/x`}
    else if(t==='ax²'){c=pick([0.5,1,2]);f=x=>c*x*x;p=pick([-3,-2,-1,1]);q=ri(2,4);label=`y = ${c===1?'':F(c)}x²`}
    else{c=pick([0.5,1,2]);f=x=>c*x**3;p=pick([-2,-1,0,1]);q=ri(2,3);label=`y = ${c===1?'':F(c)}x³`}
    const cand=[p,q];if(t==='ax²'&&p<0&&q>0)cand.push(0);const vals=cand.map(f);const mx=Math.max(...vals),mn=Math.min(...vals);

     fields:[num('наибольшее',r2(mx,4)),num('наименьшее',r2(mn,4))],hints:['Посчитай значения на концах отрезка.',t==='ax²'?'Если отрезок проходит через x = 0, проверь и вершину: y(0) = 0.':'Функция на этом отрезке монотонна — экстремумы на концах.'],
     sol:cand.map(x=>`y(${MN(x)}) = ${F(f(x),3)}`).concat([`наиб. ${F(mx,3)}, наим. ${F(mn,3)}`])}},
  'Возрастает или убывает':()=>{const t=pick(['k/x','kx','ax²','ax³','−kx']);let f,label,p=ri(1,3),q=p+ri(2,4),ans;

    return{q:`Функция ${N(label)} на отрезке ${N('['+MN(p)+'; '+MN(q)+']')} возрастает или убывает?`,fields:[choice('',['возрастает','убывает'],ans)],hints:['Посчитай y на левом и на правом конце.','Если y справа больше — возрастает.'],sol:[`y(${MN(p)}) = ${F(f(p),2)}, y(${MN(q)}) = ${F(f(q),2)} → ${ans}`]}}
 }},

    return{q:`${src(v.s,w.c)}${w.title}: размеры ${w.gen} — ${N(fx(v.a)+' × '+fx(v.b)+' м')}. Мастер перемерил ${w.acc} рулеткой; каждая сторона известна с погрешностью Δ = 0,01 м. Найдите площадь ${w.area} и запишите её в виде S ± Δ. Δ округлите вверх до одной значащей цифры.`,
     fields:[num('S =',S,{unit:'м²'}),num('Δ =',v.dS,{unit:'м²',exact:S*d,up:true})],hints:[`δ = 0,01 : ${fx(v.a)} + 0,01 : ${fx(v.b)}.`,'ΔS = S × δ, округли вверх до одной значащей цифры. Проверить можно границами: (a − 0,01)(b − 0,01) и (a + 0,01)(b + 0,01).'],
     sol:[`S = ${fx(v.a)} × ${fx(v.b)} = ${fx(S)} м²`,`δ = ${F(0.01/v.a*100)} % + ${F(0.01/v.b*100)} % ≈ ${F(d*100)} %`,`ΔS = ${fx(S)} × ${F(d,4)} ≈ ${F(S*d,3)} → ${F(v.dS)}`,`границы: ${F((v.a-0.01)*(v.b-0.01),3)} … ${F((v.a+0.01)*(v.b+0.01),3)} → ${fx(S)} ± ${F(v.dS)} м²`]}},
  'B3 · Стоимость материала':(pre)=>{const [v,w]=pre||mb();const S=v.a*v.b,top=r2(S+v.dS,2);
    return{q:`${src(v.s,w.c)}${w.title}. ${w.mat} стоит ${N(v.price+' сом за м²')}. Площадь ${w.area} — ${N(fx(S)+' ± '+F(v.dS)+' м²')}. Сколько стоит ${w.matS} на ${w.acc}, если закупать по наибольшему возможному значению площади?`,extra:expl(w),
     fields:[num('',r2(top*v.price,2),{tol:v.s==='β'?2.01:0.01,unit:'сом',show:F(top*v.price,2),traps:[[S*v.price,'Закупаем по наибольшей площади: S + ΔS, а не по S.']]})],hints:[`Наибольшая площадь: ${fx(S)} + ${F(v.dS)}.`,`Умножь на ${v.price}.`],
     sol:[`${fx(S)} + ${F(v.dS)} = ${fx(top)} м²`,`${F(top)} × ${v.price} = ${F(top*v.price,2)} сом`]}},
  'B4 · Увеличение в k раз':(pre)=>{const [v,w]=pre||mb();const P=2*(v.a+v.b),S=v.a*v.b;
    return{q:`${src(v.s,w.c)}${w.title}: размеры ${w.gen} — ${N(fx(v.a)+' × '+fx(v.b)+' м')}. Заказчик попросил ${w.acc} той же формы, но все размеры увеличить в ${N(F(v.kk)+' '+RAZ(v.kk))}. Во сколько раз вырастет длина ${w.edgeG}? Во сколько раз — площадь ${w.matG}? Найдите длину ${w.edgeG} и площадь ${w.matG} для ${w.newg}.`,extra:expl(w),
     fields:[num('край в',v.kk,{unit:RAZ(v.kk)}),num('площадь в',v.kk**2,{unit:RAZ(v.kk**2)}),num('длина',P*v.kk,{unit:'м',traps:[[P,'Это длина для старого изделия — умножь на k.'],[P*v.kk**2,'Край — это длина: растёт в k раз, а не в k².']]}),num('площадь',S*v.kk**2,{tol:0.0051,unit:'м²',show:F(S*v.kk**2,3),traps:[[S*v.kk,'Площадь растёт в k² раз, а не в k.'],[S,'Это площадь старого изделия — умножь на k².']]})],
     hints:[`${w.edge[0].toUpperCase()+w.edge.slice(1)} идёт по краю — это длина: растёт в k раз. Площадь — в k² раз.`,`Периметр сейчас: 2 × (${fx(v.a)} + ${fx(v.b)}).`],
     sol:[`край × ${F(v.kk)}, площадь × ${F(v.kk)}² = × ${F(v.kk**2)}`,`P = 2 × (${fx(v.a)} + ${fx(v.b)}) = ${F(P,1)} м → ${F(P,1)} × ${F(v.kk)} = ${F(P*v.kk,1)} м`,`S = ${F(S)} м² → ${F(S)} × ${F(v.kk**2)} = ${F(S*v.kk**2,3)} м²`]}},
  'B5 · Сканирование, DPI':(pre)=>{const [v,w]=pre||mb();const px=v.s1/2.54*v.dpi;

     fields:[num('',Math.ceil(px),{unit:'px',exact:px,up:true,traps:[[v.s1*v.dpi,'DPI — точек на дюйм. Сначала переведи сантиметры в дюймы — раздели на 2,54.']]})],hints:['DPI — точек на дюйм. 1 дюйм = 2,54 см.',`${v.s1} : 2,54 × ${v.dpi}. Пикселей должно хватить — округляй вверх.`],
     sol:[`${v.s1} : 2,54 = ${F(v.s1/2.54,3)} дюйма`,`${F(v.s1/2.54,3)} × ${v.dpi} = ${F(px,2)} → ${Math.ceil(px)} px`]}}
 }},
{id:'pct',wk:'н8',title:'Процент как множитель',lead:'Проценты не складываются — они перемножаются.',
 formulas:[['увеличить на p %:   × (1 + p/100)','+15 % → × 1,15'],['уменьшить на p %:   × (1 − p/100)','−20 % → × 0,8'],['несколько изменений подряд — перемножаем множители','скидка 20 %, потом 10 % → 0,8 × 0,9 = 0,72 → −28 %'],['сколько было: было = стало : множитель',''],['процентные пункты: 5 % → 8 % — это +3 п. п.','и +60 % от прежней доли']],
 mistakes:[['20 % + 10 % = 30 %','последовательные скидки дают 28 %, а не 30 %'],['Обратная задача вычитанием','9 000 после скидки 10 % — это 9 000 : 0,9 = 10 000, а не 9 000 + 900'],['+20 %, потом −20 %','это −4 %, а не 0']],
 gens:{
  'Две скидки подряд':()=>{const a=pick([10,15,20,25,30]),b=pick([5,10,15,20]);const tot=(1-(1-a/100)*(1-b/100))*100;return{q:`На товар сделали скидку ${N(a+' %')}, потом на новую цену — ещё скидку ${N(b+' %')}. На сколько процентов итоговая цена ниже исходной? Округлите до целых, десятых или сотых — как удобно.`,fields:[num('',tot,{flex:true,unit:'%',traps:[[a+b,`Скидки не складываются: множители перемножаются — ${F(1-a/100,2)} × ${F(1-b/100,2)}.`]]})],hints:[`Множители: ${F(1-a/100,2)} и ${F(1-b/100,2)}.`,'Перемножь их. Общая скидка = 1 − произведение.'],sol:[`${F(1-a/100,2)} × ${F(1-b/100,2)} = ${F((1-a/100)*(1-b/100),4)}`,`скидка = ${F(tot,2)} %`]}},
  'Сколько было':()=>{const p=pick([4,10,12,15,20,25]),P=ri(4,30)*1000;const kind=pick(['скидки','налога']);const S=P*(1-p/100);return{q:`После вычета ${kind} ${N(p+' %')} осталось ${N(F(S,0)+' сом')}. Какой была сумма до вычета ${kind}?`,fields:[num('',P,{tol:0.6,unit:'сом',traps:[[S*(1+p/100),'Обратная задача решается делением: S : (1 − p), а не прибавлением процента.'],[S+p/100*S,'Обратная задача решается делением: S : (1 − p).']]})],hints:[`Осталось ${100-p} % — множитель ${F(1-p/100,2)}.`,'Было = осталось : множитель.'],sol:[`${F(S,0)} : ${F(1-p/100,2)} = ${F(P,0)} сом`]}},
  'Пункты и проценты':()=>{const a=ri(2,12),b=a+ri(1,8);return{q:`Доля брака в партии выросла с ${N(a+' %')} до ${N(b+' %')}.<br>1) На сколько процентных пунктов выросла доля брака?<br>2) На сколько процентов новая доля брака больше прежней? Округлите до целых, десятых или сотых — как удобно.`,fields:[num('1) на',b-a,{unit:'п. п.',traps:[[(b-a)/a*100,'Это проценты. Пункты — простая разность долей.']]}),num('2) на',(b-a)/a*100,{flex:true,unit:'%',traps:[[b-a,'Это процентные пункты. Проценты — разность, делённая на прежнюю долю, × 100 %.'],[(b-a)/b*100,'Делим на прежнюю долю, а не на новую.']]})],hints:['Пункты — простая разность долей.','Проценты — разность, делённая на прежнюю долю, × 100 %.'],sol:[`${b} − ${a} = ${b-a} п. п.`,`${b-a} : ${a} × 100 % = ${F((b-a)/a*100,2)} %`]}},
  'Вверх и вниз':()=>{const p=pick([10,20,25,30,50]);const ch=((1+p/100)*(1-p/100)-1)*100;return{q:`Цену подняли на ${N(p+' %')}, потом снизили на ${N(p+' %')}. На сколько процентов итоговая цена отличается от исходной? Если цена уменьшилась, пишите ответ со знаком минус. Округлите до целых, десятых или сотых — как удобно.`,fields:[num('',ch,{flex:true,unit:'%',traps:[[0,'+p % и −p % не компенсируют друг друга: перемножь множители (1 + p)(1 − p).']]})],hints:[`Множители: ${F(1+p/100,2)} и ${F(1-p/100,2)}.`,'Перемножь и сравни с 1.'],sol:[`${F(1+p/100,2)} × ${F(1-p/100,2)} = ${F((1+p/100)*(1-p/100),4)} → ${F(ch,2)} %`]}}
 }},
{id:'smeta',wk:'н8',title:'Смета для заказчика',lead:'Себестоимость → наценка → комиссия → налог → на руки.',
 formulas:[['себестоимость = материалы + часы × ставка',''],['цена клиенту = себестоимость × (1 + наценка)',''],['на руки = цена × (1 − комиссия) × (1 − налог)',''],['прибыль = на руки − себестоимость',''],['наценка н % → доля в цене н : (100 + н)','40 % наценки = 28,6 % цены'],['доля в цене д % → наценка д : (100 − д)',''],['нужно на руки X → цена = X : ((1 − комиссия) × (1 − налог))','округляем вверх']],
 mistakes:[['Наценку считают от цены продажи','наценка — от себестоимости'],['Комиссию и налог складывают','налог — с остатка после комиссии: множители перемножаем'],['Прибыль в % от цены','если спрашивают «от себестоимости» — делим на себестоимость']],
 gens:{
  'Цепочка сметы':()=>{const M=ri(15,45)*100,h=ri(4,10),r=pick([500,600,700,800]),m=pick([20,25,30,40]),t=4;const C=M+h*r,P=C*(1+m/100),H=P*(1-t/100),pr=H-C;
    return{q:`Материалы — ${N(F(M,0)+' сом')}, работа — ${N(h+' ч')} по ${N(r+' сом')}. Наценка ${N(m+' %')} к себестоимости, налог ${N(t+' %')} от цены.<br>1) Какую цену назвать клиенту?<br>2) Сколько останется на руки после налога?<br>3) Какова прибыль (на руки − себестоимость)?<br>4) Сколько процентов от себестоимости составляет прибыль? Округлите до целых, десятых или сотых — как удобно.`,
     fields:[num('1) цена',r2(P,2),{tol:1.01,unit:'сом'}),num('2) на руки',r2(H,2),{tol:1.01,unit:'сом',traps:[[C*(1-t/100),'Налог берётся от цены клиенту, а не от себестоимости.']]}),num('3) прибыль',r2(pr,2),{tol:1.01,unit:'сом',traps:[[P-C,'Прибыль считаем от суммы на руки — после налога.']]}),num('4) прибыль',pr/C*100,{flex:true,unit:'% от себестоимости',traps:[[pr/P*100,'Процент — от себестоимости, а не от цены.'],[m,'Это наценка. Прибыль меньше: из цены ещё вычли налог.']]})],
     hints:[`Себестоимость = ${F(M,0)} + ${h} × ${r} = ${F(C,0)}.`,`Цена × ${F(1+m/100,2)}; на руки × 0,96; прибыль = на руки − себестоимость.`],
     sol:[`себестоимость ${F(C,0)}`,`цена ${F(C,0)} × ${F(1+m/100,2)} = ${F(P,2)}`,`на руки ${F(P,2)} × 0,96 = ${F(H,2)}`,`прибыль ${F(pr,2)} = ${F(pr/C*100,2)} % себестоимости`]}},
  'Наценка → доля в цене':()=>{const n=pick([20,25,30,40,50,60,100]);return{q:`Перекупщик покупает вещь и продаёт её с наценкой ${N(n+' %')} к цене покупки. Сколько процентов от цены продажи составляет его заработок? Округлите до целых, десятых или сотых — как удобно.`,fields:[num('',n/(100+n)*100,{flex:true,unit:'%',traps:[[n,'Наценка считается от цены покупки, а доля — от цены продажи.']]})],hints:['Возьми себестоимость 100. Какой будет цена?',`Заработок ${n} из ${100+n}.`],sol:[`${n} : ${100+n} × 100 % = ${F(n/(100+n)*100,2)} %`]}},
  'Доля в цене → наценка':()=>{const d=pick([10,15,20,25,30,40]);return{q:`Галерея забирает ${N(d+' %')} от цены продажи, остальное получает автор. На сколько процентов цена продажи больше суммы, которую получает автор? Округлите до целых, десятых или сотых — как удобно.`,fields:[num('',d/(100-d)*100,{flex:true,unit:'%',traps:[[d,'Доля считается от цены продажи, а наценка — от суммы автора.']]})],hints:[`Пусть цена продажи 100 сом: галерея забирает ${d}, автору — ${100-d}.`,`Наценка = ${d} : ${100-d}.`],sol:[`${d} : ${100-d} × 100 % = ${F(d/(100-d)*100,2)} %`]}},
  'Сколько выставить':()=>{const X=ri(5,40)*1000,c=pick([5,8,10,12,15]),t=4;const P=X/((1-c/100)*(1-t/100));return{q:`Нужно получить на руки не меньше ${N(F(X,0)+' сом')}. Площадка забирает ${N(c+' %')} от цены, потом налог ${N(t+' %')} с остатка. Какую цену поставить? Округлите вверх до сома.`,fields:[num('',Math.ceil(P-1e-9),{tol:0.6,unit:'сом',exact:P,up:true,traps:[[X*(1+c/100)*(1+t/100),'Комиссия и налог берутся от цены, а не от суммы на руки: делим на (1 − c)(1 − t).'],[X/(1-(c+t)/100),'Налог берётся с остатка: множители перемножаем, а не проценты складываем.']]})],hints:[`Множители: ${F(1-c/100,2)} и 0,96.`,'Цена = на руки : (произведение множителей), вверх.'],sol:[`${F(X,0)} : (${F(1-c/100,2)} × 0,96) = ${F(X,0)} : ${F((1-c/100)*0.96,4)} = ${F(P,2)} → ${F(Math.ceil(P-1e-9),0)} сом`]}}
 }},
{id:'compound',wk:'н9',title:'Сложный процент и рассрочка',lead:'Процент каждый раз — от того, что есть сейчас. Рассрочка или копить — зависит от того, как быстро дорожает вещь.',
 formulas:[['сложный процент:   S = S₀ × (1 + r)<sup>n</sup>','r — в долях за один период'],['простой процент:   S = S₀ + S₀ × r × n',''],['уменьшение:   S = S₀ × (1 − r)<sup>n</sup>','−18 % в год → × 0,82'],['сколько было:   S₀ = S : (1 + r)<sup>n</sup>',''],['правило 72:   удвоение ≈ 72 : (процент за период)','это оценка'],['переплата = платёж × число платежей − цена','процент — от цены'],['калькулятор: 1 200 × 1,08 = = = …','каждое «=» — ещё один период']],
 mistakes:[['10 % × 3 = 30 %','процент каждый раз от новой суммы: 1,1<sup>3</sup> = 1,331'],['Период не тот','ставка в месяц — n в месяцах'],['Переплата в % от итога','процент считаем от цены'],['Сравнение с ценой сейчас','копить — сравниваем накопленное с ценой в будущем']],
 gens:{
  'Вклад: сложный и простой':()=>{const S0=ri(4,20)*5000,r=pick([8,10,12,14,15]),n=pick([2,3,4,5]);const S=S0*(1+r/100)**n,Sp=S0*(1+r/100*n);return{q:`Вклад ${N(F(S0,0)+' сом')} под ${N(r+' %')} годовых, проценты каждый год прибавляются к вкладу.<br>1) Сколько будет на вкладе через ${pl(n,YRS)}?<br>2) Сколько было бы через ${pl(n,YRS)}, если бы проценты каждый год начислялись только на первоначальные ${N(F(S0,0)+' сом')} (простой процент)?<br>Ответы до сома.`,
     fields:[num('1) сложный',Math.round(S),{tol:1.01,unit:'сом',traps:[[Sp,'Это простой процент. Здесь проценты прибавляются к вкладу: × (1 + r)<sup>n</sup>.']]}),num('2) простой',r2(Sp,2),{tol:0.6,unit:'сом',traps:[[S,'Это сложный процент. Простой: S<sub>0</sub> × (1 + r × n).']]})],hints:[`Множитель 1 + ${F(r/100,2)} = ${F(1+r/100,2)}, в степени ${n}.`,`Простой: ${F(S0,0)} + ${n} × ${F(S0*r/100,0)}.`],sol:[`${F(S0,0)} × ${F(1+r/100,2)}${pw(n)} = ${F(S0,0)} × ${F((1+r/100)**n,6)} ≈ ${F(S,0)}`,`простой: ${F(Sp,0)}`]}},
  'Удвоение: правило 72':()=>{const r=pick([3,4,6,8,9,12]);let n=1;while((1+r/100)**n<2)n++;return{q:`Сумма растёт на ${N(r+' %')} за период.<br>1) Оцените по правилу 72: примерно за сколько периодов сумма удвоится? Ответ до десятых.<br>2) Посчитайте точно: через сколько полных периодов сумма впервые станет больше удвоенной?`,fields:[num('1) примерно',r2(72/r,1),{tol:0.051,unit:'периодов'}),num('2) точно',n,{unit:'периодов',traps:[[n-1,'На этом периоде сумма ещё не больше удвоенной — проверь следующий.']]})],hints:[`Оценка: 72 : ${r}.`,`Считай ${F(1+r/100,2)}<sup>n</sup> по шагам, пока не станет больше 2.`],sol:[`72 : ${r} = ${F(72/r,2)}`,`${F(1+r/100,2)}${pw(n-1)} ≈ ${F((1+r/100)**(n-1),3)}; ${F(1+r/100,2)}${pw(n)} ≈ ${F((1+r/100)**n,3)} → ${n}`]}},

  const card=t=>`<a class="tcard${t.id.startsWith('mid')?' mid':''}" href="#${t.id}" data-go="${t.id}"><span class="wk">${t.id.startsWith('mid')?'Мидтерм':'Неделя '+t.wk.replace('н','')}</span><b>${t.title}</b><span class="n">${pl(Object.keys(t.gens).length,['тип задач','типа задач','типов задач'])}${MAT[t.id]?' · материалы занятий':''}</span></a>`;
  $('#main').innerHTML=`
  <section class="hero">
    <div><div class="eyebrow">1 курс · математика</div>
      <h2>Тренажёр: решай, проверяй, разбирайся</h2>
      <p>Здесь собраны все темы курса. По каждой теме — тренажёр, формулы, частые ошибки и ссылки на материалы занятий.</p>
      <p>Можно повторить конкретную тему или готовиться к мидтерму и дополнительной работе по нему.</p>
      <div class="cta">${last}<a class="${midCls}" href="#midA" data-go="midA">Мидтерм: часть A</a><a class="${midCls}" href="#midB" data-go="midB">Мидтерм: часть B</a></div>
    </div>
    <div class="me" role="img" aria-label="Айдар Султанович с табличкой-приветствием">${buddySVG('hello')}</div>
  </section>
  <div class="stats">
    <div class="stat"><b>${TOPICS.length}</b><span>тем: ${reg.length} по неделям и 2 по мидтерму</span></div>
    <div class="stat"><b>${types}</b><span>типов задач</span></div>
    <div class="stat"><b>∞</b><span>задач: числа каждый раз новые, ответ проверяется сразу</span></div>
    <div class="stat"><b>72</b><span>настоящие задачи мидтерма: варианты α и β, 6 департаментов</span></div>
  </div>
  <section class="panel"><h3>Как это работает</h3><ol class="steps">
    <li>Выбери тему. Сначала прочитай формулы и частые ошибки — это то, на чём чаще всего теряют баллы.</li>
    <li>Решай в тетради, ответ впиши в поле и нажми «Проверить». Зелёное поле — верно, красное — ищи ошибку.</li>
    <li>Застрял — возьми «Подсказку». Их две-три, каждая ближе к ответу. «Решение» показывает весь ход.</li>
    <li>«Новая задача» даёт ту же задачу с другими числами. В списке над задачей можно выбрать конкретный тип.</li>
  </ol></section>
  <div class="cols">
    <section class="panel"><h3>Как вписывать ответ</h3><ul class="err">
      <li>Запятая или точка — как удобно: <b>2,5</b> = <b>2.5</b>.</li>
      <li>Дробь можно дробью: <b>1/64</b>.</li>
      <li>Пробелы в больших числах не мешают: <b>19 961 856</b>.</li>
      <li>Знак % писать не обязательно. Единицы уже стоят рядом с полем.</li>
      <li>Округляй так, как просит условие: до десятых, до сома, две значащие цифры. Где написано «как удобно», засчитается и 233, и 233,3, и 233,33.</li></ul></section>
    <section class="panel"><h3>Про мидтерм</h3><ul class="err">
      <li><b>Часть A</b> — номера A1–A6, <b>часть B</b> — кейсы B1–B5 всех департаментов.</li>
      <li>Примерно каждая третья задача — настоящая из вариантов α и β, остальные — такие же по мотивам, с другими числами.</li>
      <li>В части B все данные вписаны в условие: каждую задачу можно решать отдельно.</li>
      <li><b>Часть C</b> — ответ словами, тренажёр её не проверяет. Повтори объяснения по презентациям.</li></ul></section>
  </div>
  <section style="display:grid;gap:10px"><h3 class="sec">Мидтерм</h3><div class="tgrid">${TOPICS.filter(t=>t.id.startsWith('mid')).map(card).join('')}</div>
    <h3 class="sec">Темы по неделям</h3><div class="tgrid">${reg.map(card).join('')}</div></section>
  <p class="lead" style="font-size:.9em">Счётчик «Решено» ведётся по каждой теме отдельно и живёт, пока открыта страница: после перезагрузки он обнуляется. Тренажёр — для практики, в оценку он не идёт.</p>`;
  $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{if(!plainClick(e))return;e.preventDefault();go(b.dataset.go)});
  window.scrollTo(0,0);
}
const PRAISE=['Найс!','Зачёт!','Шаришь!','Cool!','Perfecto!','Awesome!','Баракелде!','Жакшы!','Азамат!','Сонун!','Керемет!','Чебер!','Кыйын!'];let buddyT,lastPraise='';
function nextPraise(){let p;do{p=pick(PRAISE)}while(p===lastPraise);return lastPraise=p}
function buddyPop(){const b=$('#buddy');if(!b.querySelector('svg'))b.insertAdjacentHTML('beforeend',buddySVG());$('#buddysay').textContent=nextPraise();b.classList.add('on');clearTimeout(buddyT);buddyT=setTimeout(()=>b.classList.remove('on'),2200)}
function setTopic(id){
  cur=TOPICS.find(t=>t.id===id)||TOPICS[0]; kindSel='all'; navRender(); document.title=`${cur.title} — ${SITE}`;
  window.scrollTo(0,0); const b=$('#nav a.on'), nv=$('#nav'); if(b) nv.scrollLeft=b.offsetLeft-(nv.clientWidth-b.offsetWidth)/2;
  const kinds=Object.keys(cur.gens);
  $('#main').innerHTML=`
  <section><div class="eyebrow">Неделя ${cur.wk.replace('н','')}</div><h2 class="tt">${cur.title}</h2><p class="lead">${cur.lead}</p></section>
  ${matHTML(cur.id)}
  <div class="cols">
    <div class="panel"><h3>Формулы</h3>${cur.formulas.map(([f,n])=>`<div class="f">${f}</div>${n?`<p class="fnote">${n}</p>`:''}`).join('')}</div>
    <div class="panel"><h3>Частые ошибки</h3><ul class="err">${cur.mistakes.map(([a,b])=>`<li><b>${a}.</b> ${b.charAt(0).toUpperCase()+b.slice(1)}</li>`).join('')}</ul></div>
  </div>
  <section class="card" aria-live="polite">
    <div class="cardhead"><span class="eyebrow">Тренажёр</span>
      <select id="kind" aria-label="Тип задачи"><option value="all">Все типы задач</option>${kinds.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
      <span class="score" id="score"></span></div>
    <div id="task"></div>
  </section>`;
  $('#kind').onchange=e=>{kindSel=e.target.value;newTask()};
  try{localStorage.setItem('trainer-topic',cur.id)}catch(e){}
  newTask();
}
function newTask(){
  const kinds=Object.keys(cur.gens); const k=kindSel==='all'?pick(kinds):kindSel;
  task=cur.gens[k](); task.kind=k; hintN=0; tries=0; renderTask();
}
function renderTask(){
  const t=task;
  $('#task').innerHTML=`
   <div class="eyebrow" style="color:var(--muted);margin-bottom:6px">${t.kind}</div>
   <p class="q">${t.q}</p>${t.extra||''}
   <div class="fields" style="margin-top:12px">${t.fields.map((f,i)=>f.kind==='num'
     ?`<div class="field" id="fw${i}"><label for="f${i}">${f.label||'Ответ'}</label><input id="f${i}" inputmode="${String(f.show).includes('/')?'text':'decimal'}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"><button type="button" class="pm" data-i="${i}" aria-label="Сменить знак: плюс или минус">±</button><span class="unit">${f.unit||''}</span></div>`
     :`<div class="field" id="fw${i}"><label>${f.label||'Ответ'}</label><div class="seg" id="f${i}">${f.opts.map(o=>`<button type="button" data-v="${o}">${o}</button>`).join('')}</div></div>`).join('')}</div>
   <div class="actions"><button class="btn primary" id="check">Проверить</button><button class="btn" id="hint">Подсказка</button><button class="btn" id="solbtn" disabled>Решение</button><button class="btn" id="next">Новая задача</button></div>
   <p class="msg" id="msg"></p><div class="tip" id="tip" hidden></div><div class="hints" id="hints"></div><div id="sol"></div>`;
  t.fields.forEach((f,i)=>{ if(f.kind==='choice'){ $('#f'+i).onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('#f'+i).children].forEach(x=>x.classList.toggle('sel',x===b));f.val=b.dataset.v;$('#fw'+i).classList.remove('ok','no')} }
    else { $('#f'+i).addEventListener('keydown',e=>{if(e.key==='Enter')check()}); $('#f'+i).addEventListener('input',()=>$('#fw'+i).classList.remove('ok','no')) } });
  document.querySelectorAll('#task .pm').forEach(b=>b.onclick=()=>{const inp=$('#f'+b.dataset.i);let v=inp.value.trim();inp.value=/^[-−]/.test(v)?v.replace(/^[-−]\s*/,''):'-'+v;$('#fw'+b.dataset.i).classList.remove('ok','no');inp.focus()});
  $('#check').onclick=check; $('#next').onclick=newTask; $('#hint').onclick=showHint; $('#solbtn').onclick=showSol;
  updScore(); const first=$('#f0'); if(first&&first.tagName==='INPUT'&&!matchMedia('(pointer:coarse)').matches) first.focus({preventScroll:true});
}
function diag(f,inp,v){
  const d=Math.min(decOf(inp),6), ex=f.exact??f.ans, near=(a,b)=>Math.abs(a-b)<=Math.max(0.5*10**-d,1e-6*Math.abs(b))+1e-9;
  for(const [val,msg] of f.traps) if(isFinite(val)&&near(v,val)) return msg;
  if(ex!==0&&near(v,-ex)) return 'Проверь знак ответа.';
  for(const r of [10,100,1000]){ if(ex!==0&&(near(v,ex*r)||near(v,ex/r))){
    if(String(f.unit).includes('%')&&r===100&&near(v,ex/r)) return 'Похоже, это доля, а не проценты: умножь на 100 %.';
    return `Ответ отличается от верного ровно в ${r} раз. Проверь единицы измерения (см ↔ м, г ↔ кг) и положение запятой.`}}
  const P=10**d, sc=ex*P;
  if(Math.abs(sc-Math.round(sc))>1e-7 && [Math.floor(sc),Math.ceil(sc)].some(c=>Math.abs(v-c/P)<1e-9))
    return f.up?'Повнимательнее с округлением: здесь округляем только вверх — должно хватить.':'Повнимательнее с округлением.';
  return null;
}
function check(){
  let all=true, any=false, empty=0, wrong=0; const tips=[];
  const NOTNUM='Впиши только число — без единиц и букв. Дробь пиши так: 1/64.';
  task.fields.forEach((f,i)=>{let ok=null;
    if(f.kind==='num'){const raw=$('#f'+i).value.trim(), v=parseAns(raw);
      if(!raw){empty++}
      else if(isNaN(v)){any=true; ok=false; if(!tips.includes(NOTNUM))tips.push(NOTNUM)}
      else{any=true; ok=f.flex?Math.abs(v-f.ans)<=0.5*10**-Math.min(decOf(raw),6)+1e-9:Math.abs(v-f.ans)<=f.tol+1e-9; if(!ok){const t=diag(f,raw,v); if(t&&!tips.includes(t))tips.push(t)}}}
    else {if(f.val){any=true; ok=f.val===f.ans}else empty++}
    // пустое поле не красим: оно не неверное, а незаполненное
    $('#fw'+i).classList.toggle('ok',ok===true); $('#fw'+i).classList.toggle('no',ok===false);
    if(ok!==true)all=false; if(ok===false)wrong++;});
  const m=$('#msg'), tp=$('#tip');
  if(tips.length&&any){tp.innerHTML=tips.map(t=>`<p>${t}</p>`).join('');tp.hidden=false}else{tp.hidden=true;tp.innerHTML=''}
  if(!any){m.className='msg no';m.textContent=task.fields.length>1?'Впиши ответы в поля.':'Впиши ответ в поле.';return}
  if(empty&&!wrong){m.className='msg no';m.textContent='Пока всё верно. Заполни остальные поля.';return}
  tries++; $('#solbtn').disabled=false;
  const s=sc(); if(!task.counted){task.counted=true;s.total++}
  if(all){ m.className='msg ok'; m.textContent='Верно!'; if(!task.done){task.done=true;s.solved++;buddyPop()} }
  else { m.className='msg no'; m.textContent=(tries===1?'Неверно. Проверь ход решения или возьми подсказку.':'Пока неверно. Можно открыть решение.')+(empty?' И заполни пустые поля.':''); }
  updScore();
}
function showHint(){ if(hintN<task.hints.length){ $('#hints').insertAdjacentHTML('beforeend',`<div class="hint"><b>Подсказка ${hintN+1}.</b> ${task.hints[hintN]}</div>`); hintN++ } if(hintN>=task.hints.length){$('#hint').disabled=true;$('#solbtn').disabled=false} }
function showSol(){ $('#sol').innerHTML=`<div class="sol"><b>Решение</b>${task.sol.map(s=>`<p>${s}</p>`).join('')}<p>Ответ: ${task.fields.map(f=>(f.label&&f.label!=='Ответ'?f.label+' ':'')+f.show+(f.unit&&f.kind==='num'&&!String(f.show).includes(f.unit)?' '+f.unit:'')).join('; ')}</p></div>`; task.done=true; if(!task.counted){task.counted=true;sc().total++} $('#solbtn').disabled=true; updScore() }
function updScore(){ const s=sc(); $('#score').textContent=s.total?`Решено в теме: ${s.solved} из ${s.total}`:'' }
$('#nav').onclick=e=>{const b=e.target.closest('a[data-id]');if(!b||!plainClick(e))return;e.preventDefault();go(b.dataset.id)};
window.addEventListener('popstate',route);
$('#bigbtn').onclick=()=>{const on=document.documentElement.classList.toggle('big');$('#bigbtn').setAttribute('aria-pressed',on);try{localStorage.setItem('trainer-big',on?'1':'')}catch(e){}};
try{if(localStorage.getItem('trainer-big')){document.documentElement.classList.add('big');$('#bigbtn').setAttribute('aria-pressed','true')}}catch(e){}
route();
</script>
